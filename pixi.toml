[workspace]
authors = ["Jacob Swindell <jacob.swindell@btinternet.com>"]
channels = ["conda-forge"]
name = "SuperGlue-GAIA"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
MPLBACKEND = "Agg"
RUSTIMPORT_RELEASE_BINARIES = "true"

[tasks]

[tasks.evo_exp]
args = [{ arg = "month", default = "" }, { arg = "path", default = "test" }]
cmd = "evo_rpe tum {{ path }}/gt_poses_{{ month }}.tum {{ path }}/recovered_poses_{{ month }}.tum  --align --correct_scale --plot "

[tasks.match_pairs]
args = [
    { arg = "month", default = "april" },
    { arg = "desc", default = "baseline-SIFT-SG" },
]
cmd = "./match_pairs.py --eval --viz --fast_viz --month {{ month }} --desc {{ desc }}"

[tasks.match_pairs_profile]
args = [
    { arg = "output_file", default = "profile_results.prof" },
    { arg = "month", default = "april" },
    { arg = "desc", default = "baseline-SIFT-SG" },
]
cmd = "python -m cProfile -s time -o {{ output_file }} ./match_pairs.py --eval --viz --fast_viz --month {{ month }} --desc {{ desc }}"
# cmd = "python -m scalene --html --outfile {{ output_file }} ./match_pairs.py --eval --viz --fast_viz --month {{ month }} --desc {{ desc }}"

[tasks.match_pairs_debug]
args = [
    { arg = "month", default = "april" },
    { arg = "desc", default = "baseline-SIFT-SG" },
]
cmd = "python -m pdb ./match_pairs.py --eval --viz --fast_viz --month {{ month }} --desc {{ desc }}"


[system-requirements]
cuda = "12.0"

[dependencies]
python = "==3.11"
py-opencv = ">=4.12.0,<5"
matplotlib = ">=3.10.3,<4"
numpy = ">=2.3.1,<3"
pytorch = ">=2.7.1,<3"
ultralytics = ">=8.3.169,<9"
torchvision = ">=0.22.0,<0.23"
scikit-learn = ">=1.7.1,<2"
evo = ">=1.31.1,<2"
dill = ">=0.4.0,<0.5"
kornia = ">=0.8.1,<0.9"
snakeviz = ">=2.2.2,<3"
cython = ">=3.1.2,<4"
setuptools = ">=80.9.0,<81"
scalene = ">=1.5.51,<2"
cuda = ">=12.9.1,<13"
